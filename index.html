        body {

            margin: 0; 
            /* Garante que o fundo ocupa toda a altura da página */

            /* Aplica o gradiente do azul escuro para o roxo */
            background: linear-gradient(135deg, #0b1b3d, #4b0082);
            /* Evita que o fundo se repita caso a página cresça */
            background-attachment: fixed; 

           
          font-family: Arial, Helvetica, sans-serif;

.white {
color: #ffffff;
}

<script>
function copyExtI() {
  navigator.clipboard.writeText("https://lnecel-s-extensions.vercel.app/exts/projcounters.js")

}
